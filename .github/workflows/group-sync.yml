---
name: debian-group-sync

"on":
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: glab-groups-debian-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
    uses: shared-common/glab-groups-shared/.github/workflows/group-sync-core.yml@main
    with:
      shared-repo: shared-common/glab-groups-shared
      shared-ref: main
      config-repo: shared-common/gh-actions-cfg
      config-ref: main
      config-path: glab-groups-debian
      batch-size: 25
      emit-parquet: true
      bws-version: ${{ vars.BWS_VERSION }}
      bws-sha256: ${{ vars.BWS_SHA256 }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      BWS_PROJECT_ID: ${{ secrets.BWS_PROJECT_ID }}
